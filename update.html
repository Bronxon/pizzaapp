<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>PizzApp Launcher</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      border: 1px solid #1a1a1a;
      box-sizing: border-box;
      user-select: none;
    }

    .container {
      text-align: center;
      width: 80%;
      max-width: 400px;
    }

    .logo-container {
      margin-bottom: 25px;
      position: relative;
    }

    .logo {
      width: 70px;
      height: 70px;
      filter: drop-shadow(0 0 10px rgba(255, 170, 0, 0.4));
    }

    h2 {
      font-size: 20px;
      font-weight: 500;
      margin: 0 0 10px 0;
      color: #ffaa00;
      letter-spacing: 1px;
    }

    .status-text {
      font-size: 13px;
      color: #a3a3a3;
      margin-bottom: 20px;
      min-height: 18px;
    }

    .progress-container {
      width: 100%;
      height: 6px;
      background: #1f1f1f;
      border-radius: 3px;
      overflow: hidden;
      position: relative;
      margin-bottom: 8px;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ffaa00, #ff5500);
      border-radius: 3px;
      transition: width 0.1s ease-out;
      box-shadow: 0 0 8px rgba(255, 85, 0, 0.6);
    }

    .progress-percentage {
      font-size: 11px;
      color: #737373;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <!-- Pizza slice vector logo -->
      <svg class="logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10L85 80H15L50 10Z" stroke="#ffaa00" stroke-width="6" stroke-linejoin="round"/>
        <path d="M50 22L76 74H24L50 22Z" fill="#ffaa00" fill-opacity="0.1" stroke="#ff5500" stroke-width="4" stroke-linejoin="round"/>
        <circle cx="50" cy="45" r="5" fill="#ff5500"/>
        <circle cx="40" cy="60" r="4" fill="#ff5500"/>
        <circle cx="60" cy="62" r="4" fill="#ff5500"/>
      </svg>
    </div>
    <h2>PizzApp</h2>
    <div class="status-text" id="status">Buscando actualizaciones...</div>
    <div class="progress-container">
      <div class="progress-bar" id="bar"></div>
    </div>
    <div class="progress-percentage" id="percent">0%</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const statusEl = document.getElementById('status');
    const barEl = document.getElementById('bar');
    const percentEl = document.getElementById('percent');

    ipcRenderer.on('status', (event, text) => {
      statusEl.innerText = text;
    });

    ipcRenderer.on('progress', (event, percent) => {
      const p = Math.round(percent);
      barEl.style.width = p + '%';
      percentEl.innerText = p + '%';
    });
  </script>
</body>
</html>
